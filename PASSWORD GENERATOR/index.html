<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
   <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="passwordgenerate">
        <h1> PASSWORD GENERATOR</h1>

        <label for="length">Password Length:</label>
        <input type="number" id="length" name="length" min="1" max="128" value="12">
        <br><br>
        <label for="includeUppercase"> Include Uppercase</label>
        <input type="checkbox" id="includeUppercase" name="includeUppercase">
        <br><br>
        <label for="includeLowercase"> Include Lowercase</label>
        <input type="checkbox" id="includeLowercase" name="includeLowercase">
        <br><br>
        <label for="includeNumbers"> Include Numbers</label>
        <input type="checkbox" id="includeNumbers" name="includeNumbers">
        <br><br>
        <label for="includeSpecial"> Include Special Characters</label>
        <input type="checkbox" id="includeSpecial" name="includeSpecial">
        <br><br>
        <button id="generatePassword"> Generate Password</button>
        <br><br>
        <label for="generatedPassword">Generated Password:</label>
        <input type="text" id="generatedPassword" name="generatedPassword" readonly>
        <button id="copyPassword"> Copy to Clipboard</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
